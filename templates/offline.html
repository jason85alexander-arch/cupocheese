<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c47a12">
    <title>Offline - Cup O' Cheese</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               background: #fff8e7; color: #2b2118; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               padding: 24px; text-align: center; box-sizing: border-box; }
        .box { max-width: 340px; }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { font-size: 22px; margin: 16px 0 8px; }
        p { color: #7a6a55; }
        button { margin-top: 12px; padding: 12px 20px; border: 0; border-radius: 8px; background: #c47a12; color: #fff; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/static/icons/icon-192.png" alt="">
        <h1>Can’t seem to catch a whiff</h1>
        <p>You’re offline</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
